[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tech-ai"
version = "0.1.0"
description = "Runtime de consumo do modelo médico pronto do Tech Challenge."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "FIAP Tech Challenge - Grupo" },
]
dependencies = [
  "chromadb==1.5.9",
]

[project.optional-dependencies]
# Runtime pesado de inferência local. A busca no ChromaDB e os testes não
# precisam baixar PyTorch nem os pesos do modelo.
runtime = [
  "accelerate>=1.10,<2",
  "peft>=0.20,<1",
  "torch==2.11.0",
  "transformers>=5,<6",
]

[project.scripts]
tech-ai = "tech_ai.runner:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tech_ai"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers -p no:cacheprovider --cov=src/tech_ai --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"src/tech_ai/runner.py" = ["T201"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = [
  "accelerate.*",
  "chromadb.*",
  "peft.*",
  "torch.*",
  "transformers.*",
]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
omit = [
  "src/tech_ai/runner.py",
  # Exige PyTorch, GPU e pesos reais; a fronteira é coberta por testes leves.
  "src/tech_ai/integrations/llm/huggingface.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
